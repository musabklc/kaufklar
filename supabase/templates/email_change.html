<!-- Betreff: Bestätige deine neue E-Mail-Adresse -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#0b0c0e">
  <p style="font-size:20px;font-weight:bold;margin:0 0 16px">Tachoklar</p>
  <p>Bitte bestätige, dass dein Tachoklar-Konto ab jetzt diese E-Mail-Adresse nutzen soll.</p>
  <p style="margin:24px 0"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email_change&amp;next=/konto" style="background:#1f2de6;color:#fff;padding:12px 22px;border-radius:999px;text-decoration:none;display:inline-block">Neue Adresse bestätigen</a></p>
  <p style="font-size:13px;color:#555">Der Link gilt 1 Stunde. Wenn du das nicht warst, ignoriere diese E-Mail einfach – es passiert dann nichts.</p>
  <p style="font-size:13px;color:#555">Tachoklar · <a href="{{ .SiteURL }}/impressum" style="color:#555">Impressum</a> · <a href="{{ .SiteURL }}/datenschutz" style="color:#555">Datenschutz</a></p>
</div>
